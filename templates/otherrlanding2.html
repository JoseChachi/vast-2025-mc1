<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sailor Shift - Análisis de Carrera Musical</title>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/d3/7.8.5/d3.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/Chart.js/4.4.0/chart.umd.js"></script>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: #fff;
            min-height: 100vh;
        }

        .container {
            max-width: 1400px;
            margin: 0 auto;
            padding: 20px;
        }

        .header {
            text-align: center;
            margin-bottom: 40px;
            background: rgba(255, 255, 255, 0.1);
            backdrop-filter: blur(10px);
            border-radius: 20px;
            padding: 30px;
            border: 1px solid rgba(255, 255, 255, 0.2);
        }

        .header h1 {
            font-size: 3rem;
            margin-bottom: 10px;
            background: linear-gradient(45deg, #ff6b6b, #4ecdc4);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
        }

        .header p {
            font-size: 1.2rem;
            opacity: 0.9;
        }

        .dashboard {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 30px;
            margin-bottom: 30px;
        }

        .panel {
            background: rgba(255, 255, 255, 0.1);
            backdrop-filter: blur(10px);
            border-radius: 20px;
            padding: 25px;
            border: 1px solid rgba(255, 255, 255, 0.2);
            transition: transform 0.3s ease, box-shadow 0.3s ease;
        }

        .panel:hover {
            transform: translateY(-5px);
            box-shadow: 0 20px 40px rgba(0, 0, 0, 0.3);
        }

        .panel h2 {
            margin-bottom: 20px;
            color: #4ecdc4;
            font-size: 1.5rem;
        }

        .full-width {
            grid-column: 1 / -1;
        }

        .timeline-container {
            position: relative;
            height: 400px;
            overflow-x: auto;
            overflow-y: hidden;
        }

        .timeline {
            position: relative;
            height: 100%;
            min-width: 1000px;
        }

        .timeline-line {
            position: absolute;
            top: 50%;
            left: 0;
            right: 0;
            height: 4px;
            background: linear-gradient(90deg, #ff6b6b, #4ecdc4, #45b7d1);
            border-radius: 2px;
        }

        .timeline-item {
            position: absolute;
            top: 50%;
            transform: translateY(-50%);
            cursor: pointer;
            transition: all 0.3s ease;
        }

        .timeline-item:hover {
            transform: translateY(-50%) scale(1.1);
        }

        .timeline-dot {
            width: 20px;
            height: 20px;
            border-radius: 50%;
            background: #fff;
            border: 4px solid;
            margin: 0 auto 10px;
            box-shadow: 0 4px 15px rgba(0, 0, 0, 0.3);
        }

        .timeline-content {
            background: rgba(0, 0, 0, 0.8);
            padding: 15px;
            border-radius: 10px;
            min-width: 200px;
            text-align: center;
            position: absolute;
            left: 50%;
            transform: translateX(-50%);
            opacity: 0;
            transition: opacity 0.3s ease;
        }

        .timeline-item:hover .timeline-content {
            opacity: 1;
        }

        .timeline-content h3 {
            color: #4ecdc4;
            margin-bottom: 5px;
            font-size: 1rem;
        }

        .timeline-content p {
            font-size: 0.9rem;
            opacity: 0.9;
        }

        .network-container {
            position: relative;
            height: 500px;
            border: 2px solid rgba(255, 255, 255, 0.2);
            border-radius: 15px;
            overflow: hidden;
        }

        .influence-list {
            max-height: 300px;
            overflow-y: auto;
        }

        .influence-item {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 15px;
            margin-bottom: 10px;
            background: rgba(255, 255, 255, 0.1);
            border-radius: 10px;
            transition: background 0.3s ease;
        }

        .influence-item:hover {
            background: rgba(255, 255, 255, 0.2);
        }

        .influence-name {
            font-weight: bold;
            color: #4ecdc4;
        }

        .influence-type {
            font-size: 0.9rem;
            opacity: 0.8;
        }

        .influence-strength {
            width: 100px;
            height: 8px;
            background: rgba(255, 255, 255, 0.2);
            border-radius: 4px;
            overflow: hidden;
        }

        .influence-bar {
            height: 100%;
            background: linear-gradient(90deg, #ff6b6b, #4ecdc4);
            border-radius: 4px;
            transition: width 0.5s ease;
        }

        .stats-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(200px, 1fr));
            gap: 20px;
        }

        .stat-card {
            background: rgba(255, 255, 255, 0.1);
            padding: 20px;
            border-radius: 15px;
            text-align: center;
            transition: transform 0.3s ease;
        }

        .stat-card:hover {
            transform: scale(1.05);
        }

        .stat-number {
            font-size: 2.5rem;
            font-weight: bold;
            color: #4ecdc4;
            display: block;
        }

        .stat-label {
            font-size: 1rem;
            opacity: 0.9;
            margin-top: 5px;
        }

        .controls {
            margin-bottom: 20px;
            display: flex;
            gap: 15px;
            flex-wrap: wrap;
        }

        .control-btn {
            background: rgba(255, 255, 255, 0.2);
            border: none;
            padding: 10px 20px;
            border-radius: 25px;
            color: #fff;
            cursor: pointer;
            transition: all 0.3s ease;
            font-size: 0.9rem;
        }

        .control-btn:hover {
            background: rgba(255, 255, 255, 0.3);
            transform: translateY(-2px);
        }

        .control-btn.active {
            background: #4ecdc4;
            color: #000;
        }

        .loading {
            text-align: center;
            padding: 40px;
            font-size: 1.2rem;
        }

        .spinner {
            width: 24px;
            height: 24px;
            border: 3px solid rgba(255, 255, 255, 0.3);
            border-top: 3px solid #4ecdc4;
            border-radius: 50%;
            animation: spin 1s linear infinite;
        }

        @keyframes spin {
            0% { transform: rotate(0deg); }
            100% { transform: rotate(360deg); }
        }

        .error {
            background: rgba(255, 107, 107, 0.2);
            border: 1px solid #ff6b6b;
            border-radius: 10px;
            padding: 20px;
            margin: 20px 0;
        }

        @media (max-width: 768px) {
            .dashboard {
                grid-template-columns: 1fr;
            }
            
            .header h1 {
                font-size: 2rem;
            }
            
            .controls {
                flex-direction: column;
            }
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="header">
            <h1>🌊 Sailor Shift</h1>
            <p>Análisis Completo de Carrera Musical - Oceanus Folk</p>
        </div>

        <div class="controls">
            <button class="control-btn active" onclick="showTimeline()">Cronología</button>
            <button class="control-btn" onclick="showInfluences()">Influencias</button>
            <button class="control-btn" onclick="showCollaborations()">Colaboraciones</button>
            <button class="control-btn" onclick="showGenreImpact()">Impacto en Género</button>
            <button class="control-btn" onclick="loadData()">Recargar Datos</button>
        </div>

        <div class="dashboard">
            <div class="panel full-width">
                <h2>📈 Evolución Profesional</h2>
                <div class="timeline-container">
                    <div class="timeline" id="timeline">
                        <div class="loading">Cargando línea de tiempo...</div>
                    </div>
                </div>
            </div>

            <div class="panel">
                <h2>🎭 Principales Influencias</h2>
                <div class="influence-list" id="influences">
                    <div class="loading">Analizando influencias...</div>
                </div>
            </div>

            <div class="panel">
                <h2>🤝 Red de Colaboraciones</h2>
                <div class="network-container" id="collaborations">
                    <div class="loading">Construyendo red de colaboraciones...</div>
                </div>
            </div>

            <div class="panel full-width">
                <h2>📊 Estadísticas de Carrera</h2>
                <div class="stats-grid" id="stats">
                    <div class="loading">Calculando estadísticas...</div>
                </div>
            </div>
        </div>
    </div>

    <script>
        let musicData = null;
        let currentView = 'timeline';
        let isLoading = false;
        let cachedStats = null; // Cache para las estadísticas

        // Simulación de datos mientras se conecta con Flask
        const sampleData = {
            nodes: [
                {
                    "Node Type": "Song",
                    "name": "Breaking These Chains",
                    "single": true,
                    "release_date": "2017",
                    "genre": "Oceanus Folk",
                    "notable": true,
                    "id": 0
                },
                {
                    "Node Type": "Person",
                    "name": "Sailor Shift",
                    "id": 1
                },
                {
                    "Node Type": "Person", 
                    "name": "Carlos Duffy",
                    "id": 2
                },
                {
                    "Node Type": "Song",
                    "name": "Ocean Dreams",
                    "single": false,
                    "release_date": "2018",
                    "genre": "Oceanus Folk",
                    "notable": true,
                    "id": 3
                },
                {
                    "Node Type": "Song",
                    "name": "Tidal Waves",
                    "single": true,
                    "release_date": "2019",
                    "genre": "Oceanus Folk",
                    "notable": false,
                    "id": 4
                },
                {
                    "Node Type": "Song",
                    "name": "Deep Blue",
                    "single": false,
                    "release_date": "2020",
                    "genre": "Oceanus Folk",
                    "notable": true,
                    "id": 5
                },
                {
                    "Node Type": "Person",
                    "name": "Marina Waves",
                    "id": 6
                },
                {
                    "Node Type": "Person",
                    "name": "Ocean Echo",
                    "id": 7
                }
            ],
            links: [
                {
                    "Edge Type": "PerformerOf",
                    "source": 1,
                    "target": 0,
                    "key": 0
                },
                {
                    "Edge Type": "RecordedBy",
                    "source": 0,
                    "target": 2,
                    "key": 0
                },
                {
                    "Edge Type": "PerformerOf",
                    "source": 1,
                    "target": 3,
                    "key": 0
                },
                {
                    "Edge Type": "CollaboratedWith",
                    "source": 1,
                    "target": 6,
                    "key": 0
                },
                {
                    "Edge Type": "InfluencedBy",
                    "source": 1,
                    "target": 7,
                    "key": 0
                }
            ]
        };

        async function loadData() {
            if (isLoading) return;
            
            isLoading = true;
            showLoadingState();
            
            try {
                // Intenta cargar desde tu servidor Flask
                console.log('🔄 Cargando datos desde el servidor...');
                const response = await fetch('/api/music-data');
                
                if (response.ok) {
                    musicData = await response.json();
                    console.log('✅ Datos cargados exitosamente:', musicData);
                    
                    // Calcular estadísticas una sola vez al cargar los datos
                    cachedStats = calculateStats();
                } else {
                    throw new Error(`Error del servidor: ${response.status}`);
                }
            } catch (error) {
                console.log('⚠️ Usando datos de ejemplo:', error.message);
                musicData = sampleData;
                cachedStats = calculateStats();
            } finally {
                isLoading = false;
                updateVisualization();
            }
        }

        function showLoadingState() {
            // Mostrar indicadores de carga en todas las secciones
            document.getElementById('timeline').innerHTML = `
                <div class="loading">
                    <div style="display: flex; align-items: center; justify-content: center; gap: 10px;">
                        <div class="spinner"></div>
                        <span>Cargando cronología de Sailor Shift...</span>
                    </div>
                </div>
            `;
            
            document.getElementById('influences').innerHTML = `
                <div class="loading">
                    <div style="display: flex; align-items: center; justify-content: center; gap: 10px;">
                        <div class="spinner"></div>
                        <span>Analizando influencias musicales...</span>
                    </div>
                </div>
            `;
            
            document.getElementById('collaborations').innerHTML = `
                <div class="loading">
                    <div style="display: flex; align-items: center; justify-content: center; gap: 10px;">
                        <div class="spinner"></div>
                        <span>Construyendo red de colaboraciones...</span>
                    </div>
                </div>
            `;
            
            document.getElementById('stats').innerHTML = `
                <div class="loading">
                    <div style="display: flex; align-items: center; justify-content: center; gap: 10px;">
                        <div class="spinner"></div>
                        <span>Calculando estadísticas...</span>
                    </div>
                </div>
            `;
        }

        function calculateStats() {
            if (!musicData || !musicData.nodes || !musicData.links) {
                return {
                    totalSongs: 0,
                    notableSongs: 0,
                    yearsActive: 0,
                    collaborators: 0
                };
            }

            // Encontrar el nodo de Sailor Shift
            const sailorShiftNode = musicData.nodes.find(n => n.name === "Sailor Shift");
            if (!sailorShiftNode) {
                console.warn('⚠️ No se encontró el nodo de Sailor Shift');
                return {
                    totalSongs: 0,
                    notableSongs: 0,
                    yearsActive: 0,
                    collaborators: 0
                };
            }

            console.log('📊 Calculando estadísticas para:', sailorShiftNode);

            // Encontrar canciones interpretadas por Sailor Shift
            const sailorShiftSongs = [];
            
            musicData.links.forEach(link => {
                if (link["Edge Type"] === "PerformerOf" && link.source === sailorShiftNode.id) {
                    const song = musicData.nodes.find(n => n.id === link.target);
                    if (song && song["Node Type"] === "Song") {
                        sailorShiftSongs.push(song);
                    }
                }
            });

            console.log('🎵 Canciones encontradas:', sailorShiftSongs);

            const notableSongs = sailorShiftSongs.filter(song => song.notable === true || song.notable === "true").length;
            const totalSongs = sailorShiftSongs.length;
            
            // Calcular años activa
            let yearsActive = 0;
            if (sailorShiftSongs.length > 0) {
                const years = sailorShiftSongs
                    .filter(s => s.release_date)
                    .map(s => parseInt(s.release_date))
                    .filter(year => !isNaN(year));
                
                if (years.length > 0) {
                    const minYear = Math.min(...years);
                    const maxYear = Math.max(...years);
                    yearsActive = maxYear - minYear + 1;
                }
            }

            // Encontrar colaboradores únicos
            const collaborators = new Set();
            musicData.links.forEach(link => {
                if ((link.source === sailorShiftNode.id || link.target === sailorShiftNode.id) &&
                    (link["Edge Type"] === "CollaboratedWith" || 
                     link["Edge Type"] === "RecordedBy" ||
                     link["Edge Type"] === "PerformerOf")) {
                    
                    const otherId = link.source === sailorShiftNode.id ? link.target : link.source;
                    const other = musicData.nodes.find(n => n.id === otherId);
                    
                    if (other && other["Node Type"] === "Person" && other.name !== "Sailor Shift") {
                        collaborators.add(other.name);
                    }
                }
            });

            const stats = {
                totalSongs: totalSongs,
                notableSongs: notableSongs,
                yearsActive: yearsActive,
                collaborators: collaborators.size
            };

            console.log('📈 Estadísticas calculadas:', stats);
            return stats;
        }

        function updateVisualization() {
            if (!musicData || isLoading) return;

            console.log('🔄 Actualizando visualización, vista actual:', currentView);

            switch(currentView) {
                case 'timeline':
                    createTimeline();
                    break;
                case 'influences':
                    createInfluencesView();
                    break;
                case 'collaborations':
                    createCollaborationsNetwork();
                    break;
                case 'genre-impact':
                    createGenreImpactView();
                    break;
            }
            
            // Usar estadísticas en caché
            createStatsView();
        }

        function createTimeline() {
            const timeline = document.getElementById('timeline');
            
            if (!musicData || !musicData.nodes || !musicData.links) {
                timeline.innerHTML = '<div class="error">No hay datos disponibles para la cronología</div>';
                return;
            }

            timeline.innerHTML = '<div class="timeline-line"></div>';

            // Encontrar el nodo de Sailor Shift
            const sailorShiftNode = musicData.nodes.find(n => n.name === "Sailor Shift");
            if (!sailorShiftNode) {
                timeline.innerHTML = '<div class="error">No se encontró información de Sailor Shift</div>';
                return;
            }

            // Filtrar canciones de Sailor Shift
            const songs = [];
            musicData.links.forEach(link => {
                if (link["Edge Type"] === "PerformerOf" && link.source === sailorShiftNode.id) {
                    const song = musicData.nodes.find(n => n.id === link.target);
                    if (song && song["Node Type"] === "Song" && song.release_date) {
                        songs.push(song);
                    }
                }
            });

            if (songs.length === 0) {
                timeline.innerHTML = '<div class="error">No se encontraron canciones con fechas de lanzamiento</div>';
                return;
            }

            songs.sort((a, b) => parseInt(a.release_date) - parseInt(b.release_date));

            const startYear = Math.min(...songs.map(s => parseInt(s.release_date)));
            const endYear = Math.max(...songs.map(s => parseInt(s.release_date)));
            const yearRange = endYear - startYear || 1;

            console.log(`📅 Cronología: ${songs.length} canciones desde ${startYear} hasta ${endYear}`);

            songs.forEach((song, index) => {
                const year = parseInt(song.release_date);
                const position = ((year - startYear) / yearRange) * 80 + 10; // 10% margin on each side

                const timelineItem = document.createElement('div');
                timelineItem.className = 'timeline-item';
                timelineItem.style.left = `${position}%`;

                const dot = document.createElement('div');
                dot.className = 'timeline-dot';
                dot.style.borderColor = song.notable ? '#ff6b6b' : '#4ecdc4';

                const content = document.createElement('div');
                content.className = 'timeline-content';
                content.style.bottom = index % 2 === 0 ? '60px' : 'auto';
                content.style.top = index % 2 === 0 ? 'auto' : '60px';

                content.innerHTML = `
                    <h3>${song.name}</h3>
                    <p>${song.release_date}</p>
                    <p>${song.single ? 'Single' : 'Álbum'}</p>
                    ${song.notable ? '<p style="color: #ff6b6b;">★ Notable</p>' : ''}
                `;

                timelineItem.appendChild(dot);
                timelineItem.appendChild(content);
                timeline.appendChild(timelineItem);
            });
        }

        function createInfluencesView() {
            const influencesDiv = document.getElementById('influences');
            
            // Encontrar todas las influencias de Sailor Shift
            const sailorShiftNode = musicData.nodes.find(n => n.name === "Sailor Shift");
            if (!sailorShiftNode) {
                influencesDiv.innerHTML = '<div class="error">No se encontró información de Sailor Shift</div>';
                return;
            }

            const influences = musicData.links
                .filter(link => link.source === sailorShiftNode.id && 
                       (link["Edge Type"] === "InfluencedBy" || 
                        link["Edge Type"] === "InterpolatesFrom" ||
                        link["Edge Type"] === "InspiredBy"))
                .map(link => {
                    const influencer = musicData.nodes.find(n => n.id === link.target);
                    return {
                        name: influencer ? influencer.name : 'Desconocido',
                        type: link["Edge Type"],
                        strength: Math.random() * 100 // Simulado - podrías calcular esto basado en frecuencia
                    };
                });

            if (influences.length === 0) {
                // Crear datos de ejemplo si no hay influencias explícitas
                const sampleInfluences = [
                    { name: "Ocean Echo", type: "InfluencedBy", strength: 85 },
                    { name: "Marina Waves", type: "CollaboratedWith", strength: 70 },
                    { name: "Carlos Duffy", type: "RecordedBy", strength: 60 },
                    { name: "Traditional Folk", type: "InspiredBy", strength: 90 }
                ];
                influences.push(...sampleInfluences);
            }

            influencesDiv.innerHTML = influences
                .sort((a, b) => b.strength - a.strength)
                .map(influence => `
                    <div class="influence-item">
                        <div>
                            <div class="influence-name">${influence.name}</div>
                            <div class="influence-type">${influence.type}</div>
                        </div>
                        <div class="influence-strength">
                            <div class="influence-bar" style="width: ${influence.strength}%"></div>
                        </div>
                    </div>
                `).join('');
        }

        function createCollaborationsNetwork() {
            const networkDiv = document.getElementById('collaborations');
            networkDiv.innerHTML = '';

            // Crear SVG para la red
            const svg = d3.select('#collaborations')
                .append('svg')
                .attr('width', '100%')
                .attr('height', '100%');

            const width = networkDiv.clientWidth;
            const height = networkDiv.clientHeight;

            // Encontrar colaboraciones de Sailor Shift
            const sailorShiftNode = musicData.nodes.find(n => n.name === "Sailor Shift");
            const collaborations = musicData.links.filter(link => 
                (link.source === sailorShiftNode.id || link.target === sailorShiftNode.id) &&
                (link["Edge Type"] === "CollaboratedWith" || 
                 link["Edge Type"] === "RecordedBy" ||
                 link["Edge Type"] === "PerformerOf")
            );

            // Crear nodos para la visualización
            const networkNodes = [sailorShiftNode];
            collaborations.forEach(link => {
                const otherNodeId = link.source === sailorShiftNode.id ? link.target : link.source;
                const otherNode = musicData.nodes.find(n => n.id === otherNodeId);
                if (otherNode && !networkNodes.find(n => n.id === otherNode.id)) {
                    networkNodes.push(otherNode);
                }
            });

            // Configurar simulación de fuerza
            const simulation = d3.forceSimulation(networkNodes)
                .force('link', d3.forceLink(collaborations).id(d => d.id).distance(100))
                .force('charge', d3.forceManyBody().strength(-300))
                .force('center', d3.forceCenter(width / 2, height / 2));

            // Crear enlaces
            const links = svg.selectAll('line')
                .data(collaborations)
                .enter()
                .append('line')
                .attr('stroke', '#4ecdc4')
                .attr('stroke-width', 2)
                .attr('opacity', 0.7);

            // Crear nodos
            const nodes = svg.selectAll('circle')
                .data(networkNodes)
                .enter()
                .append('g');

            nodes.append('circle')
                .attr('r', d => d.name === "Sailor Shift" ? 20 : 10)
                .attr('fill', d => {
                    if (d.name === "Sailor Shift") return '#ff6b6b';
                    if (d["Node Type"] === "Person") return '#4ecdc4';
                    return '#45b7d1';
                })
                .attr('stroke', '#fff')
                .attr('stroke-width', 2);

            nodes.append('text')
                .text(d => d.name)
                .attr('text-anchor', 'middle')
                .attr('dy', '0.35em')
                .attr('font-size', '12px')
                .attr('fill', '#fff')
                .attr('font-weight', 'bold');

            // Actualizar posiciones en la simulación
            simulation.on('tick', () => {
                links
                    .attr('x1', d => d.source.x)
                    .attr('y1', d => d.source.y)
                    .attr('x2', d => d.target.x)
                    .attr('y2', d => d.target.y);

                nodes
                    .attr('transform', d => `translate(${d.x},${d.y})`);
            });
        }

        function createGenreImpactView() {
            // Esta función analizaría el impacto en el género Oceanus Folk
            const influencesDiv = document.getElementById('influences');
            
            influencesDiv.innerHTML = `
                <div class="stat-card">
                    <span class="stat-number">🌊</span>
                    <div class="stat-label">Pionera del Oceanus Folk</div>
                </div>
                <div style="margin-top: 20px;">
                    <h3 style="color: #4ecdc4; margin-bottom: 15px;">Impacto en el Género</h3>
                    <p>Sailor Shift ha sido fundamental en el desarrollo del Oceanus Folk, introduciendo elementos únicos que han influenciado a toda una generación de artistas.</p>
                    <br>
                    <h4 style="color: #4ecdc4;">Contribuciones Principales:</h4>
                    <ul style="margin-left: 20px; margin-top: 10px;">
                        <li>Fusión de elementos marítimos tradicionales</li>
                        <li>Innovación en instrumentación acústica</li>
                        <li>Narrativas oceánicas contemporáneas</li>
                    </ul>
                </div>
            `;
        }

        function createStatsView() {
            const statsDiv = document.getElementById('stats');
            
            // Usar estadísticas en caché si están disponibles
            if (cachedStats) {
                console.log('📊 Usando estadísticas en caché:', cachedStats);
                
                statsDiv.innerHTML = `
                    <div class="stat-card">
                        <span class="stat-number">${cachedStats.totalSongs}</span>
                        <div class="stat-label">Canciones Totales</div>
                    </div>
                    <div class="stat-card">
                        <span class="stat-number">${cachedStats.notableSongs}</span>
                        <div class="stat-label">Canciones Notables</div>
                    </div>
                    <div class="stat-card">
                        <span class="stat-number">${cachedStats.yearsActive}</span>
                        <div class="stat-label">Años Activa</div>
                    </div>
                    <div class="stat-card">
                        <span class="stat-number">${cachedStats.collaborators}</span>
                        <div class="stat-label">Colaboradores</div>
                    </div>
                `;
            } else {
                statsDiv.innerHTML = `
                    <div class="loading">
                        <div style="display: flex; align-items: center; justify-content: center; gap: 10px;">
                            <div class="spinner"></div>
                            <span>Calculando estadísticas...</span>
                        </div>
                    </div>
                `;
            }
        }

        // Funciones de navegación
        function showTimeline() {
            if (isLoading) return;
            currentView = 'timeline';
            updateActiveButton('timeline');
            updateVisualization();
        }

        function showInfluences() {
            if (isLoading) return;
            currentView = 'influences';
            updateActiveButton('influences');
            updateVisualization();
        }

        function showCollaborations() {
            if (isLoading) return;
            currentView = 'collaborations';
            updateActiveButton('collaborations');
            updateVisualization();
        }

        function showGenreImpact() {
            if (isLoading) return;
            currentView = 'genre-impact';
            updateActiveButton('genre-impact');
            updateVisualization();
        }

        function updateActiveButton(activeView) {
            document.querySelectorAll('.control-btn').forEach(btn => {
                btn.classList.remove('active');
            });
            
            const buttonMap = {
                'timeline': 0,
                'influences': 1,
                'collaborations': 2,
                'genre-impact': 3
            };
            
            const activeButton = document.querySelectorAll('.control-btn')[buttonMap[activeView]];
            if (activeButton) {
                activeButton.classList.add('active');
            }
        }

        // Inicializar la aplicación
        document.addEventListener('DOMContentLoaded', () => {
            loadData();
        });

        // Redimensionar visualizaciones cuando cambie el tamaño de ventana
        window.addEventListener('resize', () => {
            if (currentView === 'collaborations') {
                createCollaborationsNetwork();
            }
        });
    </script>
</body>
</html>
