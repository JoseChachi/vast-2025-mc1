<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Oceanus Folk - Visualizaciones de influencia</title>

    <script src="https://d3js.org/d3.v7.min.js"></script>
    <link rel="stylesheet" href="{{ url_for('static', filename='css/style-2.css') }}">

    <style>
        svg.graph { display: none; }
        .artist-table { border-collapse: collapse; margin-top: 1rem; width: 100%; }
        .artist-table th, .artist-table td { border: 1px solid #ccc; padding: .4rem .6rem; text-align: left; }
        .artist-table tr:nth-child(even) { background:#f9f9f9; }
    </style>
    </head>
    <body>
    <h1>Oceanus Folk Influence Explorer</h1>

    <label for="viewSelector"><strong>Elegir gráfico:</strong></label>
    <select id="viewSelector">
        <option value="timeline">¿Difusión intermitente o gradual?</option>
        <option value="bars">Géneros y artistas más influenciados</option>
        <option value="box">Evolución caja-año post-Sailor</option>
    </select>

    <!-- 1. TIMELINE -->
    <h2 id="title-timeline">1. ¿Difusión intermitente o gradual?</h2>
    <svg id="timeline" class="graph" width="960" height="300"></svg>

    <!-- 2. BARRAS -->
    <h2 id="title-bars">2. Géneros y artistas más influenciados</h2>
    <svg id="bars" class="graph" width="960" height="400"></svg>
    <div id="artistTable"></div>

    <!-- 3. Caja acumulada post-Sailor -->
    <h2 id="title-box">3. Evolución acumulada post-Sailor</h2>

    <div id="boxPane" style="position:relative;">
    <!-- slider debajo de la caja -->

    <div id="yearBoxWrap" style="display:none;gap:8px">        
        <input id="yearBoxSlider" type="range" style="width:260px">
        <div id="yearBoxCtrl">                                  
            <button id="bPrev">⏮</button>                      
            <button id="bPlay">⏯</button>                      
            <button id="bNext">⏭</button>                      
        </div>                                                  
    </div>                 

    <svg id="boxChart" class="graph" width="960" height="460"></svg>
    </div>

    <!-- tooltip flotante para todos los gráficos -->
    <div id="tooltip"
        style="position:absolute;pointer-events:none;
                background:rgba(0,0,0,.75);color:#fff;
                padding:6px 8px;border-radius:4px;
                font:12px sans-serif;opacity:0;">
    </div>

    <!-- JS principal -->
    <script src="{{ url_for('static', filename='js/graph-2.js') }}"></script>
</body>
</html>
